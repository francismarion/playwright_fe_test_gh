name: Playwright Tests Native Kubernetes (Option B)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write # Required if pushing to GitHub Packages (GHCR)

jobs:
  build-image:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  test-k8s:
    needs: build-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Set Kubernetes Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }} # Your K8s cluster access configuration

      - name: Deploy Shard Job to Kubernetes
        run: |
          # Dynamically swap values in our manifest template
          export SHARD_NUMBER=${{ matrix.shard }}
          export TOTAL_SHARDS=${{ strategy.job-total }}
          export IMAGE_TAG=${{ needs.build-image.outputs.image_tag }}
          
          sed -i "s|ghcr.io/your-username/your-repo:latest|$IMAGE_TAG|g" k8s-playwright-job.yaml
          envsubst < k8s-playwright-job.yaml | kubectl apply -f -

      - name: Wait for Job Completion & Stream Logs
        run: |
          # Wait for the specific shard job to finish executing inside the cluster
          kubectl wait --for=condition=complete job/playwright-shard-${{ matrix.shard }} --timeout=600s
          # Stream logs to GitHub UI so you can debug failures easily
          kubectl logs job/playwright-shard-${{ matrix.shard }}

  generate-report:
    needs: test-k8s
    if: always()
    runs-on: ubuntu-latest
    steps:
      # AWS CLI is pre-installed on ubuntu-latest
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Pull all the partial shard data down from your centralized cloud storage bucket
      - name: Download all Allure results from S3
        run: |
          mkdir merged-allure-results
          aws s3 sync s3://your-playwright-allure-bucket/runs/${{ github.run_id }}/ merged-allure-results/

      - name: Checkout repository to get config
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate Allure report
        run: |
          npm install -g allure-commandline
          allure generate merged-allure-results --clean -o allure-report

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  deploy:
    needs: generate-report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4