name: Playwright Tests with Allure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read      # allow checkout
  pages: write        # allow publishing to Pages
  id-token: write     # required for OIDC authentication

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 1. Choose how many shards you want (e.g., 1, 2, 3)
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests with Allure Sharding
        # 2. Pass the matrix values dynamically to Playwright's shard flag
        run: npx playwright test --reporter=line,allure-playwright --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload partial Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Give each artifact a unique name so they don't overwrite each other
          name: allure-results-shard-${{ matrix.shard }}
          path: allure-results
          retention-days: 1

  generate-report:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 3. Download ALL the shard pieces into a single target directory
      - name: Download all Allure results
        uses: actions/download-artifact@v4
        with:
          path: merged-allure-results
          pattern: allure-results-shard-*
          merge-multiple: true

      # 4. Generate the final combined Allure report from the merged data
      - name: Generate Allure report
        run: npx allure generate merged-allure-results --clean -o allure-report

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

  deploy:
    needs: generate-report
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4